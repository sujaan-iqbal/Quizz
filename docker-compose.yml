version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000   # Pass to build
    ports:
      - "80:80"
    # Remove the 'environment' section for VITE_API_URL – it’s not used at runtime